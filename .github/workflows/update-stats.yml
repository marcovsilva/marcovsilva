name: Update GitHub Profile Stats & Trophies

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=marcovsilva&layout=compact&langs_count=6&theme=dracula"
          path: profile-cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophy Card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=marcovsilva&theme=dracula&column=3&margin-w=10&margin-h=10&no-frame=false"
          path: profile-cards/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-cards/
          git commit -m "chore: update profile stats and trophies" || exit 0
          git push
